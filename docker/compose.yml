services:

  casas_db:
    image: docker.io/postgis/postgis:17-3.5
    container_name: casas_db
    restart: always
    env_file:
      - casas.env
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    networks:
      - internal

  casas_redis:
    image: docker.io/redis:8-alpine
    container_name: casas_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - internal

  casas_django:
    image: localhost/casas
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
    hostname: casaswebapp
    container_name: casas_django
    restart: always
    volumes:
      - ./data:/opt/casas/
    expose:
      - "8080"
    depends_on:
      - casas_db
      - casas_redis
    env_file:
      - casas.env
    networks:
      - internal

  casas_nginx-reverseproxy:
    image: docker.io/nginx:1.27
    hostname: reverse-proxy
    container_name: casas_nginx
    ports:
      - "443:443"
    volumes:
     - "./nginx/nginx.conf:/etc/nginx/conf.d/default.conf"
     # This is the path to your SSL certificate and key
     # Ensure these files exist and are correctly configured
     #- "./nginx/cert_bundle.pem:/etc/ssl/private/cert_bundle.pem"
     #- "./nginx/privateKey.pem:/etc/ssl/private/privateKey.pem"
    networks:
     - internal
     - external
    restart: always

volumes:
  db_data:
  redis_data:

networks:
  internal:
    driver: bridge
  external:
